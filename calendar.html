<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Said</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="calendar.css">
  <link rel="icon" type="image/png" href="foto2.png">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar__brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M3 9.5h18M8 3v4M16 3v4"/>
          <circle cx="8" cy="14" r="1" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="14" r="1" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="14" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <div class="brand__text">
        <p class="brand__eyebrow">Agenda</p>
        <h1 class="brand__title" id="periodTitle">—</h1>
      </div>
    </div>

    <nav class="topbar__nav" aria-label="Navigasi periode">
      <button class="navbtn" id="btnPrev" type="button" aria-label="Periode sebelumnya">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="navbtn navbtn--today" id="btnToday" type="button">Hari ini</button>
      <button class="navbtn" id="btnNext" type="button" aria-label="Periode berikutnya">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </nav>

    <div class="topbar__views" role="tablist" aria-label="Pilih tampilan kalender" id="viewSwitch">
      <button class="viewbtn" role="tab" data-view="year" type="button">Tahun</button>
      <button class="viewbtn" role="tab" data-view="month" type="button" aria-selected="true">Bulan</button>
      <button class="viewbtn" role="tab" data-view="week" type="button">Minggu</button>
      <button class="viewbtn" role="tab" data-view="day" type="button">Hari</button>
    </div>
  </header>

  <div class="workspace">
    <main class="stage" id="stage">
      <section class="view view--year" id="viewYear" hidden>
        <div class="yeargrid" id="yearGrid"></div>
      </section>

      <section class="view view--month" id="viewMonth" hidden>
        <div class="weekday-row" id="monthWeekdayRow"></div>
        <div class="monthgrid" id="monthGrid"></div>
      </section>

      <section class="view view--week" id="viewWeek" hidden>
        <div class="weekgrid" id="weekGrid"></div>
      </section>

      <section class="view view--day" id="viewDay" hidden>
        <div class="daytimeline" id="dayTimeline"></div>
      </section>
    </main>

    <aside class="agenda" id="agenda" aria-live="polite">
      <div class="agenda__scrim" id="agendaScrim"></div>
      <div class="agenda__sheet" id="agendaSheet">
        <button class="agenda__close" id="agendaClose" type="button" aria-label="Tutup agenda">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <p class="agenda__eyebrow" id="agendaWeekday">—</p>
        <h2 class="agenda__date" id="agendaDate">—</h2>
        <div class="agenda__list" id="agendaList"></div>
      </div>
    </aside>
  </div>

  <footer class="footer">
    <p>Kalender Said · Format waktu <code>24 jam</code> · Agenda mendukung rentang waktu</p>
  </footer>
</div>
<script src="calendar.js"></script>
</body>
</html>
